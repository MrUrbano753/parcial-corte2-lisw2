spring.application.name=question-service
server.port=${QUESTION_SERVICE_PORT:8083}

# RabbitMQ (Punto 2.2)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Si un mensaje no se puede enrutar a ninguna cola, el broker lo devuelve y queda en el log
spring.rabbitmq.publisher-returns=true

# Validation Service (Punto 2.1, REST síncrono)
services.validation.url=${VALIDATION_SERVICE_URL:http://localhost:8082}/validate

# Persistencia JPA en H2 (Punto 3)
spring.datasource.url=${QUESTION_DB_URL:jdbc:h2:mem:question_db;DB_CLOSE_DELAY=-1}
spring.datasource.username=${QUESTION_DB_USER:sa}
spring.datasource.password=${QUESTION_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Consola: http://localhost:8083/h2-console  (JDBC URL: jdbc:h2:mem:question_db, usuario sa)
spring.h2.console.enabled=true

# Swagger OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.co.unicauca.iso2.parcial2=INFO
